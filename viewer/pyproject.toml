[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "loglens-viewer"
version = "0.1.0"
description = "구조화 로그 실시간 뷰어 / 분석기 — adb → 로컬 서버 → SSE → 브라우저"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
# 의존성 없음. 표준 라이브러리만 쓴다 — pip 설치도, 단일 바이너리 패키징도 쉬워진다.
dependencies = []

[project.scripts]
loglens = "loglens.cli:main"

[tool.setuptools.packages.find]
include = ["loglens*"]

[tool.setuptools.package-data]
loglens = ["web/*"]
