<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LogLens</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<header class="bar">
  <div class="brand">Log<span>Lens</span></div>
  <div class="status"><span id="dot" class="dot"></span><span id="status">연결 중…</span></div>
  <div class="src" id="src"></div>
  <div class="spacer"></div>
  <div class="counts"><b id="cShown">0</b> / <span id="cTotal">0</span> 줄</div>
  <button id="btnTables" class="btn" hidden>표</button>
  <button id="btnFlows" class="btn" title="flowId 로 이어진 흐름을 타임라인으로">흐름</button>
  <button id="btnEvents" class="btn" title="앱이 찍는 이벤트 — 커버리지와 사전">이벤트</button>
  <div class="menuwrap">
    <button id="btnSession" class="btn" title="로그를 파일로 저장하거나 저장한 파일을 연다">세션 ▾</button>
    <div id="sessMenu" class="dropdown" hidden>
      <button data-act="export"><b>지금 로그를 파일로 저장</b><i>.loglens — 팀원이 기기 없이 열 수 있음 · 원문 본문은 뺌</i></button>
      <button data-act="export-full"><b>원문까지 넣어 저장</b><i>요청·응답 본문이 그대로 들어감 — 개인정보가 남아 있을 수 있음</i></button>
      <button data-act="open"><b>세션 파일 열기…</b><i>실시간 수신을 멈추고 파일 내용을 봄</i></button>
      <p class="dd-hint">파일을 창에 끌어다 놓아도 열립니다</p>
    </div>
  </div>
  <button id="btnDash" class="btn">분석</button>
  <button id="btnPause" class="btn">일시정지</button>
  <button id="btnClear" class="btn">비우기</button>
</header>

<div id="sessBar" class="sessbar" hidden>
  <b>세션 파일 보는 중</b><span id="sessName"></span><span class="dim">실시간 수신 멈춤</span>
  <button id="sessLive" class="btn sm">실시간으로 돌아가기</button>
</div>
<input type="file" id="sessFile" accept=".loglens,.log,.txt" hidden>
<div id="dropZone" class="dropzone" hidden><div>세션 파일을 놓으면 엽니다</div></div>

<nav class="tabs" id="tabs"></nav>

<div class="toolbar">
  <div class="levels" id="levels"></div>
  <input id="q" class="q" type="search" placeholder="검색 (evt / 필드 / 메시지 / 태그)" autocomplete="off">
  <label class="chk"><input type="checkbox" id="rx"> 정규식</label>
  <label class="chk"><input type="checkbox" id="onlyStruct"> 구조화만</label>
  <label class="chk" title="요청·응답 본문을 통째로 실은 줄만 본다"><input type="checkbox" id="onlyPayload"> 원문만</label>
  <label class="chk" id="pidWrap" hidden><input type="checkbox" id="onlyPid"> <span id="pidLabel">이 앱만</span></label>
  <label class="chk"><input type="checkbox" id="autoscroll" checked> 자동스크롤</label>
</div>

<main>
  <section class="tree-pane" id="treePane" hidden></section>
  <section class="logs" id="logs"></section>
  <aside class="tray">
    <h2>이슈 트레이 <span class="hint">자동 그룹핑</span></h2>
    <div id="tray"><p class="empty">아직 이슈 없음</p></div>
  </aside>
</main>

<section class="dash" id="dash" hidden>
  <div class="dash-inner">
    <div class="dash-head">
      <h2>분석 대시보드</h2>
      <span class="hint">버퍼 전체 집계 · 구조화 로그라서 가능한 것</span>
      <button id="dashClose" class="btn">닫기</button>
    </div>
    <div id="dashBody" class="dash-body"></div>
  </div>
</section>

<section class="dash" id="tbl" hidden>
  <div class="dash-inner tbl-inner">
    <div class="dash-head">
      <h2 id="tblTitle">표</h2>
      <span class="hint" id="tblHint"></span>
      <span class="tmsg" id="tblMsg"></span>
      <div class="tacts2">
        <button id="tblMd" class="btn" title="지금 보이는 표를 Markdown 으로 복사">Markdown 복사</button>
        <button id="tblCsv" class="btn" title="지금 보이는 표를 CSV 파일로 저장">CSV 저장</button>
        <button id="tblSave" class="btn" hidden title="이 묶음을 파일로 남긴다. 뷰어를 다시 켜도 비교할 수 있다">이 묶음 저장</button>
        <button id="tblReload" class="btn" hidden title="앱 소스에서 구현 목록을 다시 읽는다">구현 목록 새로고침</button>
      </div>
      <button id="tblClose" class="btn">닫기</button>
    </div>
    <div class="tbl-ctl">
      <label class="sel">묶음 <select id="tblGroup"></select></label>
      <label class="sel">비교 <select id="tblCmp"></select></label>
      <input id="tblQ" class="q" type="search" placeholder="코드 / 값 검색" autocomplete="off">
      <label class="sel">보기 <select id="tblShow">
        <option value="all">전체</option>
        <option value="on">켜짐 (들어온 것)</option>
        <option value="off">꺼짐 (안 들어온 것)</option>
        <option value="extra">클라이언트 구현 외</option>
        <option value="bad">형식 문제</option>
      </select></label>
      <label class="chk"><input type="checkbox" id="tblRecv"> 받은 순서</label>
      <label class="chk"><input type="checkbox" id="tblHist"> 이력 보기</label>
      <label class="chk" id="tblFlipWrap" hidden><input type="checkbox" id="tblFlip"> 바뀐 것만</label>
      <label class="chk" id="tblSameWrap" hidden><input type="checkbox" id="tblSame"> 같은 것도 보기</label>
    </div>
    <div id="tblBody" class="tbl-body"></div>
  </div>
</section>

<section class="dash det" id="det" hidden>
  <div class="dash-inner det-inner">
    <div class="dash-head">
      <h2 id="detTitle"></h2>
      <span class="hint" id="detHint"></span>
      <button id="detClose" class="btn">닫기</button>
    </div>
    <div id="detBody" class="det-body"></div>
  </div>
</section>

<section class="dash det" id="plw" hidden>
  <div class="dash-inner pl-inner">
    <div class="dash-head">
      <h2 id="plTitle"></h2>
      <span class="hint" id="plHint"></span>
      <div class="seg" id="plTabs"></div>
      <div class="tacts2">
        <button id="plFold" class="btn" hidden title="전부 접기 / 펴기">전부 접기</button>
        <button id="plCopy" class="btn" title="지금 보이는 모양 그대로 복사">복사</button>
      </div>
      <button id="plClose" class="btn">닫기</button>
    </div>
    <div id="plNote" class="pl-note"></div>
    <div id="plBody" class="pl-body"></div>
  </div>
</section>

<section class="dash" id="flw" hidden>
  <div class="dash-inner flw-inner">
    <div class="dash-head">
      <h2>흐름</h2>
      <span class="hint" id="flwHint">flowId 로 이어진 로그를 시간순으로</span>
      <div class="tacts2"><button id="flwRefresh" class="btn" title="버퍼에서 다시 읽기">새로고침</button></div>
      <button id="flwClose" class="btn">닫기</button>
    </div>
    <div class="flw-grid">
      <aside class="flw-side">
        <div class="flw-filters" id="flwFilters"></div>
        <input id="flwQ" class="q" type="search" placeholder="계정 / flowId / 이벤트" autocomplete="off">
        <div class="flw-list" id="flwList"></div>
      </aside>
      <section class="flw-main" id="flwMain"></section>
    </div>
  </div>
</section>

<section class="dash" id="evw" hidden>
  <div class="dash-inner flw-inner">
    <div class="dash-head">
      <h2>이벤트</h2>
      <div class="seg" id="evTabs">
        <button data-tab="cov" class="on">커버리지</button>
        <button data-tab="dict">사전 <b id="evLintN"></b></button>
      </div>
      <span class="hint" id="evScope"></span>
      <div class="tacts2"><button id="evReset" class="btn" title="지금부터 다시 센다">다시 세기</button></div>
      <button id="evClose" class="btn">닫기</button>
    </div>
    <div id="evBody" class="ev-body"></div>
  </div>
</section>

<!-- 로그 → 코드 줄 후보 메뉴. 로그 목록은 계속 다시 그려지므로 그 밖에 둔다 -->
<div id="gotoMenu" class="gotomenu" hidden></div>
<div id="toast" class="toast" hidden></div>

<script src="/static/app.js"></script>
</body>
</html>
